                                        <div class="bg-slate-50 p-2.5 rounded-lg text-xs text-slate-600 mb-3 border border-slate-100">
                                            💡 ${item.tip}
                                        </div>
                                        <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                                            <span class="text-xs text-slate-400">체류: ${item.duration}</span>
                                            <a href="https://map.naver.com/v5/search/${encodeURIComponent(item.mapQuery)}" target="_blank" class="bg-orange-50 text-orange-600 hover:bg-orange-100 text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center">
                                                <i data-lucide="map-pin" class="w-3.5 h-3.5 mr-1"></i> 길찾기
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'map') {
                container.innerHTML = `
                    <div class="p-5 space-y-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">🗺️ 인터랙티브 동선 & 지도</h2>
                            <p class="text-xs text-slate-500 mt-0.5">자차 이동 경로 순서와 주요 방문 포인트입니다.</p>
                        </div>

                        <!-- Visual Route Flow Box -->
                        <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-5 rounded-2xl shadow-md space-y-3">
                            <h3 class="text-sm font-bold text-orange-400 flex items-center"><i data-lucide="route" class="w-4 h-4 mr-1.5"></i> 드라이브 이동 경로</h3>
                            <div class="flex flex-col space-y-2 text-xs text-slate-300">
                                <div class="flex items-center space-x-2"><span class="w-5 h-5 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold text-[10px]">1</span> <span>수원 출발 ➔ 곡교천 은행나무길</span></div>
                                <div class="flex items-center space-x-2"><span class="w-5 h-5 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold text-[10px]">2</span> <span>온양온천 전통시장 & 5일장</span></div>
                                <div class="flex items-center space-x-2"><span class="w-5 h-5 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold text-[10px]">3</span> <span>온양 족욕체험장 (도보 3분)</span></div>
                                <div class="flex items-center space-x-2"><span class="w-5 h-5 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold text-[10px]">4</span> <span>온양민속박물관 & 구정아트센터</span></div>
                                <div class="flex items-center space-x-2"><span class="w-5 h-5 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold text-[10px]">5</span> <span>신정호 지방정원 (일몰/산책)</span></div>
                                <div class="flex items-center space-x-2"><span class="w-5 h-5 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold text-[10px]">6</span> <span>먼구리식당 (오삼불고기 저녁)</span></div>
                                <div class="flex items-center space-x-2"><span class="w-5 h-5 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold text-[10px]">7</span> <span>함가네 호떡 야식 ➔ 수원 귀가</span></div>
                            </div>
                        </div>

                        <!-- Location Cards with Direct Link -->
                        <div class="space-y-3">
                            <h3 class="font-bold text-slate-800 text-sm">📍 장소별 빠른 길찾기</h3>
                            ${tripData.schedule.map(item => `
                                <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm">
                                    <div>
                                        <span class="text-[10px] bg-orange-50 text-orange-600 px-2 py-0.5 rounded font-medium">${item.time}</span>
                                        <h4 class="font-bold text-slate-800 text-sm mt-1">${item.title}</h4>
                                        <p class="text-xs text-slate-500">${item.transport}</p>
                                    </div>
                                    <a href="https://map.naver.com/v5/search/${encodeURIComponent(item.mapQuery)}" target="_blank" class="bg-slate-900 text-white hover:bg-slate-800 text-xs font-medium px-3 py-2 rounded-lg transition flex items-center space-x-1">
                                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                                        <span>지도보기</span>
                                    </a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'food') {
                container.innerHTML = `
                    <div class="p-5 space-y-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">🍽️ 코스 내 미식 & 디저트</h2>
                            <p class="text-xs text-slate-500 mt-0.5">로컬 노포부터 디저트 맛집까지 엄선된 정보입니다.</p>
                        </div>

                        <div class="space-y-3">
                            ${tripData.food.map((f, idx) => `
                                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">맛집 ${idx+1}</span>
                                            <h3 class="font-bold text-slate-800 text-base mt-1">${f.name}</h3>
                                        </div>
                                        <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2.5 py-1 rounded-lg">${f.price}</span>
                                    </div>
                                    <p class="text-xs font-medium text-slate-700">대표메뉴: <span class="text-orange-600">${f.menu}</span></p>
                                    <p class="text-xs text-slate-500 leading-relaxed">${f.desc}</p>
                                    <div class="bg-slate-50 p-2 rounded text-[11px] text-slate-600 border border-slate-100 flex items-center">
                                        <i data-lucide="clock" class="w-3.5 h-3.5 mr-1 text-slate-400"></i> ${f.timing}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'tips') {
                container.innerHTML = `
                    <div class="p-5 space-y-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">🛡️ 데이터 분석가의 운영 리스크 방어 팁</h2>
                            <p class="text-xs text-slate-500 mt-0.5">실제 여행 시 꼭 체크해야 할 핵심 주의사항입니다.</p>
                        </div>

                        <div class="space-y-3">
                            ${tripData.tips.map((tip, idx) => `
                                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-1.5">
                                    <div class="flex items-center space-x-2">
                                        <div class="w-6 h-6 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-bold text-xs">!</div>
                                        <h3 class="font-bold text-slate-800 text-sm">${tip.title}</h3>
                                    </div>
                                    <p class="text-xs text-slate-600 leading-relaxed pl-8">${tip.desc}</p>
                                </div>
                            `).join('')}
                        </div>

                        <div class="bg-orange-50 border border-orange-200 p-4 rounded-xl text-center space-y-2 mt-4">
                            <h4 class="font-bold text-orange-800 text-sm">💡 스마트 가이드북 활용법</h4>
                            <p class="text-xs text-orange-700 leading-relaxed">스마트폰에서 언제든지 각 일정의 '길찾기' 버튼을 눌러 네이버 지도와 연동하여 편리하게 아산 여행을 즐기세요!</p>
                        </div>
                    </div>
                `;
            }

            // Re-initialize Lucide Icons after rendering
            lucide.createIcons();
        }

        function openToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Initial Load on Window Load
        window.onload = function() {
            switchTab('home');
        };
    </script>
</body>
</html>
